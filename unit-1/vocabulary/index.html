<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 4 • Unit 1 Vocabulary Lab</title>
<link rel="icon" type="image/png" href="../../skaya-logo-white-bg-purple-favicon.png">
<style>
:root{
  --ink:#183153;
  --blue:#75d5e8;
  --yellow:#ffd86b;
  --pink:#f2a6c9;
  --purple:#c8b4f5;
  --green:#9bd47a;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink);
  background:linear-gradient(135deg,#fff5c9,#e9f9ff);
}
button{font:inherit;color:inherit}
.top{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  gap:10px;
  padding:12px 16px;
  background:#ffffffed;
  box-shadow:0 3px 12px #18315318;
}
.nav{
  border:0;
  border-radius:14px;
  padding:10px 15px;
  font-weight:800;
  cursor:pointer;
  background:#edf2f7;
}
header{
  text-align:center;
  padding:28px 16px 12px;
}
header h1{
  font-size:clamp(30px,5vw,48px);
  margin:8px 0;
}
header p{
  margin:10px 0 0;
  font-size:17px;
}
.eyebrow{
  display:inline-block;
  background:var(--green);
  color:white;
  border-radius:999px;
  padding:7px 14px;
  font-weight:800;
}
.wrap{
  max-width:1050px;
  margin:auto;
  padding:18px;
}
.panel{
  background:#fffffff2;
  border-radius:28px;
  padding:24px;
  box-shadow:0 12px 32px #1831531c;
}
.panel h2{
  margin-top:0;
}
.weekgrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-top:20px;
}
.week{
  position:relative;
  border:0;
  border-radius:23px;
  padding:23px 16px;
  text-align:left;
  cursor:pointer;
  box-shadow:0 6px 0 #1831531b;
  min-height:180px;
  transition:transform .18s ease, box-shadow .18s ease;
}
.week:hover{
  transform:translateY(-4px);
  box-shadow:0 10px 18px #1831531b;
}
.week h3{
  font-size:21px;
  margin:8px 0;
}
.week p{
  line-height:1.4;
  margin-bottom:0;
}
.w1{background:#fff0b5}
.w2{background:#dff5d5}
.w3{background:#f8ddec}
.w4{background:#e7ddff}
.tag{
  display:inline-block;
  background:white;
  border-radius:999px;
  padding:5px 9px;
  font-size:12px;
  font-weight:800;
}
.empty{
  opacity:.78;
  cursor:default;
}
.empty:hover{
  transform:none;
  box-shadow:0 6px 0 #1831531b;
}

.new-badge{
  position:absolute;
  top:14px;
  right:14px;
  background:#ff6f91;
  color:white;
  border-radius:999px;
  padding:6px 10px;
  font-size:11px;
  font-weight:900;
  box-shadow:0 3px 8px #18315322;
}
.lock-icon{
  display:block;
  font-size:28px;
  margin-top:14px;
}
.wip-text{
  display:block;
  margin-top:7px;
  font-size:13px;
  font-weight:800;
  color:#65758b;
}

@media(max-width:850px){
  .weekgrid{grid-template-columns:1fr 1fr}
}
@media(max-width:550px){
  .weekgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <span class="eyebrow">COMPASS • UNIT 1</span>
  <h1>📖 Vocabulary Lab</h1>
  <p>Learn the words • Practise them • Master them! 🚀</p>
</header>

<main class="wrap">
  <section class="panel">
    <h2>🌟 Choose a Week</h2>
    <p>Choose a week to practise your Unit 1 vocabulary.</p>

    <div class="weekgrid">
      <button class="week w1" onclick="location.href='week1.html'">
        <span class="tag">10 WORDS</span>
        <h3>🌅 WEEK 1</h3>
        <b>Daily Activities</b>
        <p>Original Vocabulary Lab</p>
      </button>

      <button class="week w2" type="button" onclick="location.href='week2.html'">
        <span class="new-badge">NEW</span>
        <span class="tag">10 WORDS</span>
        <h3>🎒 WEEK 2</h3>
        <b>Daily Routines</b>
        <p>Vocabulary Practice</p>
      </button>

      <button class="week w3 empty" type="button" aria-disabled="true">
        <span class="tag">WEEK 3</span>
        <h3>🎉 WEEK 3</h3>
        <span class="lock-icon">🔒</span>
        <span class="wip-text">Work in Progress</span>
      </button>

      <button class="week w4 empty" type="button">
        <span class="tag">WEEK 4</span>
        <h3>⭐ WEEK 4</h3>
      </button>
    </div>
  </section>
</main>

</body>
</html>
